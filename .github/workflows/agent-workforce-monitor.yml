name: Agent Workforce Monitor

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, closed, ready_for_review, review_requested]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Normalize GitHub event
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: python3 .github/agent_workforce/normalize_event.py --output monitor-event.json

      - name: Store monitor event
        uses: actions/upload-artifact@v4
        with:
          name: agent-workforce-monitor-${{ github.run_id }}
          path: monitor-event.json
          retention-days: 14

      - name: Notify M Monitor endpoint
        if: ${{ secrets.MONITOR_WEBHOOK_URL != '' }}
        env:
          MONITOR_WEBHOOK_URL: ${{ secrets.MONITOR_WEBHOOK_URL }}
          MONITOR_WEBHOOK_TOKEN: ${{ secrets.MONITOR_WEBHOOK_TOKEN }}
        run: |
          set -euo pipefail
          headers=(-H 'Content-Type: application/json')
          if [ -n "${MONITOR_WEBHOOK_TOKEN:-}" ]; then
            headers+=( -H "Authorization: Bearer ${MONITOR_WEBHOOK_TOKEN}" )
          fi
          curl --fail --silent --show-error --retry 2 --max-time 15 \
            "${headers[@]}" \
            --data-binary @monitor-event.json \
            "$MONITOR_WEBHOOK_URL"
