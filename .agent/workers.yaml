planning_note: >-
  token_budget는 작업 계획용 추정치다. 실제 Codex 구독 사용량은 모델, reasoning,
  문맥, 도구 호출에 따라 달라지므로 usage_remaining_percent를 함께 확인한다.

defaults:
  reserve_ratio: 0.20
  max_parallel_primary_tasks_per_worker: 1
  split_if_task_exceeds_daily_budget_ratio: 0.50
  usage_check_before_claim: true
  usage_check_after_task: true

